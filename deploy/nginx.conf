# ---------------------------------------------------------------------------
# nginx site config for the portfolio.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace igaurav.dev with your domain before enabling.
# TLS blocks assume certbot; see DEPLOY.md for the exact command.
# ---------------------------------------------------------------------------

# Defence in depth for the paid endpoint. The application already enforces a
# per-visitor token bucket and a daily spend ceiling; this stops a flood from
# ever reaching Node in the first place.
limit_req_zone $binary_remote_addr zone=ask_zone:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=30r/m;
limit_req_status 429;

upstream portfolio_upstream {
    # max_fails=0 keeps nginx from ejecting the only backend it has during a
    # deploy restart. Combined with the retry settings below, the ~1s gap
    # while PM2 restarts the process is usually invisible to a visitor.
    server 127.0.0.1:8008 max_fails=0;
    keepalive 32;
}

# --------------------------- HTTP → HTTPS ---------------------------
server {
    listen 80;
    listen [::]:80;
    server_name igaurav.dev www.igaurav.dev;

    # Leave this open so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://igaurav.dev$request_uri;
    }
}

# --------------------------- www → apex ---------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.igaurav.dev;

    ssl_certificate     /etc/letsencrypt/live/igaurav.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/igaurav.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://igaurav.dev$request_uri;
}

# --------------------------- the site ---------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name igaurav.dev;

    ssl_certificate     /etc/letsencrypt/live/igaurav.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/igaurav.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Résumé uploads are capped at 8MB in the application. nginx defaults to
    # 1MB, which would reject them with a 413 before Node ever sees the file.
    client_max_body_size 10M;
    client_body_timeout 60s;

    # The app sets X-Frame-Options, X-Content-Type-Options and Referrer-Policy
    # itself (next.config.ts). These are the ones only the edge can set.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/woff2;

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log warn;

    # ---- shared proxy settings ----
    # X-Forwarded-For matters here: lib/ratelimit.ts reads it to identify a
    # visitor. Drop it and every visitor shares one bucket.
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_cache_bypass $http_upgrade;

    # Deploys restart a single process (see ecosystem.config.cjs for why it is
    # single). Retry briefly instead of surfacing the restart as a 502.
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 6s;

    # ---- immutable build output ----
    # Hashed filenames, safe to cache forever. This is the only thing on the
    # site that can be cached at all — every page renders per request by design.
    location /_next/static/ {
        proxy_pass http://portfolio_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://portfolio_upstream;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /favicon.ico { proxy_pass http://portfolio_upstream; access_log off; }
    location = /robots.txt  { proxy_pass http://portfolio_upstream; }
    location = /sitemap.xml { proxy_pass http://portfolio_upstream; }

    # ---- the paid endpoint ----
    location /api/ask {
        limit_req zone=ask_zone burst=10 nodelay;
        proxy_pass http://portfolio_upstream;
        proxy_read_timeout 45s;
        proxy_buffering off;
    }

    # ---- admin ----
    # Résumé extraction sends a PDF to Claude and can legitimately run for a
    # minute; the app's own cap is 60s, so give nginx headroom above that.
    location /api/admin/ {
        limit_req zone=admin_zone burst=10 nodelay;

        # Optional but recommended — uncomment and set your own address.
        # allow 203.0.113.4;
        # deny all;

        proxy_pass http://portfolio_upstream;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    location /admin {
        limit_req zone=admin_zone burst=20 nodelay;

        # allow 203.0.113.4;
        # deny all;

        proxy_pass http://portfolio_upstream;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---- everything else ----
    # proxy_buffering off so React Server Component streaming reaches the
    # browser as it is produced rather than being held until complete.
    location / {
        proxy_pass http://portfolio_upstream;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
