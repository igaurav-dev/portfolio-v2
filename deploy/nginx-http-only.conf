# ---------------------------------------------------------------------------
# Minimal HTTP-only config. Use this to get the site reachable before DNS and
# TLS are in place, then switch to nginx.conf and run certbot.
#
#   sudo cp deploy/nginx-http-only.conf /etc/nginx/sites-available/portfolio
#   sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

upstream portfolio_upstream {
    server 127.0.0.1:8008;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /_next/static/ {
        proxy_pass http://portfolio_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /api/admin/ {
        proxy_pass http://portfolio_upstream;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://portfolio_upstream;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
