upstream portfolio_upstream {
    server 127.0.0.1:8008;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name igaurav.dev www.igaurav.dev;
    return 301 https://igaurav.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name igaurav.dev www.igaurav.dev;

    ssl_certificate /etc/letsencrypt/live/igaurav.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/igaurav.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.igaurav.dev) {
        return 301 https://igaurav.dev$request_uri;
    }

    client_max_body_size 10M;
    client_body_timeout 60s;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    location /_next/static/ {
        proxy_pass http://portfolio_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://portfolio_upstream;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/ask {
        proxy_pass http://portfolio_upstream;
        proxy_read_timeout 45s;
        proxy_buffering off;
    }

    location /api/admin/ {
        proxy_pass http://portfolio_upstream;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    location /admin {
        proxy_pass http://portfolio_upstream;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://portfolio_upstream;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
